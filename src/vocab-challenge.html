<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self';" />
<title>Bumbee Challenge</title>
<style>
  :root {
    --brand: #f4c842;
    --bg: #10151f;
    --card: #182130;
    --line: #2a3547;
    --text: #eef2f8;
    --muted: #93a1b5;
    --ok: #35c88a;
    --bad: #e5556b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
    background: transparent;
    color: var(--text);
    display: flex; align-items: flex-start; justify-content: flex-end;
    padding: 10px;
    user-select: none;
  }
  .card {
    width: 100%;
    max-height: calc(100vh - 20px);
    min-height: 0;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    box-shadow: 0 18px 50px rgba(0,0,0,.45);
    padding: 16px 16px 14px;
    display: flex; flex-direction: column; gap: 12px;
    overflow-y: auto;
    overscroll-behavior: contain;
    scrollbar-color: rgba(147, 161, 181, .55) transparent;
    animation: pop .18s ease;
    /* KHÔNG để cả card là vùng kéo — nếu không sẽ nuốt mất thao tác scroll.
       Chỉ thanh .top mới kéo được (xem bên dưới). */
  }
  /* thanh cuộn luôn hiện rõ để không bị che chữ */
  .card::-webkit-scrollbar { width: 10px; }
  .card::-webkit-scrollbar-thumb { background: rgba(147,161,181,.5); border-radius: 6px; }
  .card::-webkit-scrollbar-track { background: transparent; }
  @keyframes pop { from { transform: translateY(10px) scale(.98); opacity: 0; } to { transform: none; opacity: 1; } }
  /* Thanh trên cùng = vùng kéo thả cửa sổ */
  .top {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    position: sticky; top: 0; z-index: 3;
    background: var(--card);
    -webkit-app-region: drag; cursor: grab; padding-bottom: 2px;
  }
  .badge { font-size: 11px; font-weight: 700; color: #1a1205; background: var(--brand); padding: 3px 8px; border-radius: 999px; letter-spacing: .3px; }
  .meta { font-size: 11px; color: var(--muted); text-align: right; line-height: 1.4; }
  .x { cursor: pointer; color: var(--muted); font-size: 18px; line-height: 1; padding: 2px 4px; -webkit-app-region: no-drag; }
  .x:hover { color: var(--text); }
  .scene { font-size: 12.5px; color: var(--muted); }
  .cue { font-size: 16px; font-weight: 650; line-height: 1.35; }
  .term-pill { display:inline-block; color: var(--brand); }
  .choices { display: flex; flex-direction: column; gap: 8px; }
  .choice {
    text-align: left; cursor: pointer;
    background: #131b27; border: 1px solid var(--line); color: var(--text);
    padding: 10px 12px; border-radius: 10px; font-size: 13.5px; line-height: 1.3;
    display: flex; gap: 8px; align-items: flex-start; transition: border-color .12s, background .12s;
  }
  .choice:hover { border-color: var(--brand); }
  .choice .k { font-size: 11px; color: var(--muted); font-weight: 700; min-width: 14px; }
  .choice.correct { border-color: var(--ok); background: rgba(53,200,138,.12); }
  .choice.wrong { border-color: var(--bad); background: rgba(229,85,107,.12); }
  .choice[disabled] { cursor: default; }
  /* ── 🧠 Game từ vựng siêu trí nhớ (khung riêng, song song game câu) ── */
  .wgame {
    background: linear-gradient(135deg, rgba(120,160,255,.10), rgba(160,120,255,.06));
    border: 1.5px solid rgba(140,150,255,.45);
    border-radius: 14px;
    padding: 10px 12px;
    display: flex; flex-direction: column; gap: 7px;
    position: relative;
  }
  .wgame::before { content: "🧠"; position: absolute; top: -10px; right: 10px; font-size: 16px; filter: drop-shadow(0 2px 3px rgba(0,0,0,.4)); }
  .wgame .whead { display: flex; align-items: center; justify-content: space-between; }
  .wgame .wtitle { font-size: 10.5px; font-weight: 800; letter-spacing: .4px; color: #aab6ff; text-transform: uppercase; }
  .wgame .wstreak { font-size: 10.5px; color: #ffd97a; font-weight: 700; }
  .wgame .wcue { font-size: 13px; font-weight: 600; line-height: 1.3; }
  .wchoices { display: flex; flex-wrap: wrap; gap: 6px; }
  .wchoice {
    cursor: pointer; background: #131b27; border: 1px solid var(--line); color: var(--text);
    padding: 5px 11px; border-radius: 999px; font-size: 12.5px; transition: border-color .12s, transform .08s;
  }
  .wchoice:hover { border-color: #aab6ff; transform: translateY(-1px); }
  .wchoice.correct { border-color: var(--ok); background: rgba(53,200,138,.15); }
  .wchoice.wrong { border-color: var(--bad); background: rgba(229,85,107,.15); }
  .wchoice[disabled] { cursor: default; }
  .wfeedback { font-size: 11.5px; min-height: 14px; color: var(--muted); }
  .wfeedback.ok { color: var(--ok); }
  .wfeedback.bad { color: var(--bad); }

  /* ── 💬 Gợi ý cụm giao tiếp mới ── */
  .sugg {
    background: rgba(53,200,138,.07);
    border: 1px dashed rgba(53,200,138,.45);
    border-radius: 12px;
    padding: 8px 10px;
    display: flex; align-items: center; gap: 8px;
    font-size: 12px;
  }
  .sugg .icon { font-size: 15px; }
  .sugg .body { flex: 1; line-height: 1.35; }
  .sugg .phrase { color: #7fe0b6; font-weight: 700; }
  .sugg .viNote { color: var(--muted); }
  .sugg .btns { display: flex; gap: 4px; }

  /* ── Thẻ Từ vựng 🐝: hiện từ + nghĩa VI + ví dụ (sau khi trả lời / khi thêm từ mới) ── */
  .spot {
    background: linear-gradient(135deg, rgba(244,200,66,.14), rgba(244,200,66,.05));
    border: 1.5px solid rgba(244,200,66,.55);
    border-radius: 14px;
    padding: 10px 12px;
    display: flex; flex-direction: column; gap: 4px;
    animation: pop .22s ease;
    position: relative;
  }
  .spot::before { content: "🐝"; position: absolute; top: -10px; right: 10px; font-size: 16px; filter: drop-shadow(0 2px 3px rgba(0,0,0,.4)); }
  .spot .tag { font-size: 10px; font-weight: 700; letter-spacing: .4px; color: var(--brand); text-transform: uppercase; }
  .spot .termrow { display: flex; align-items: center; gap: 8px; }
  .spot .term { font-size: 19px; font-weight: 800; color: var(--brand); }
  .spot .ipa { font-size: 11.5px; color: var(--muted); }
  .spot .vi { font-size: 13px; color: var(--text); }
  .spot .vi b { color: #ffd97a; }
  .spot .ex { font-size: 12px; color: var(--muted); font-style: italic; border-left: 2px solid rgba(244,200,66,.4); padding-left: 8px; }
  .fbrow { display: flex; align-items: center; gap: 6px; min-height: 20px; }
  .feedback { font-size: 12.5px; flex: 1; }
  .feedback.ok { color: var(--ok); }
  .feedback.bad { color: var(--bad); }
  .speak { cursor: pointer; background: none; border: 1px solid var(--line); color: var(--muted); border-radius: 8px; font-size: 13px; padding: 2px 8px; }
  .speak:hover { color: var(--brand); border-color: var(--brand); }
  .addrow { display: flex; gap: 6px; align-items: center; }
  .addrow input {
    flex: 1; background: #131b27; border: 1px solid var(--line); color: var(--text);
    border-radius: 8px; padding: 7px 10px; font-size: 12.5px; outline: none;
  }
  .addrow input:focus { border-color: var(--brand); }
  .addrow input::placeholder { color: #5d6b80; }
  .addmsg { font-size: 11px; color: var(--muted); min-height: 13px; }
  .addmsg.ok { color: var(--ok); }
  select.mode {
    background: #131b27; border: 1px solid var(--line); color: var(--muted);
    border-radius: 8px; font-size: 11px; padding: 3px 4px; cursor: pointer; outline: none;
  }
  select.mode:hover { color: var(--text); border-color: var(--brand); }
  .foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-top: 2px; border-top: 1px solid var(--line); }
  .foot .left { display: flex; gap: 10px; align-items: center; font-size: 11px; color: var(--muted); }
  .foot label { display: flex; gap: 4px; align-items: center; cursor: pointer; }
  .btn { cursor: pointer; background: #131b27; border: 1px solid var(--line); color: var(--muted); padding: 5px 10px; border-radius: 8px; font-size: 11.5px; }
  .btn:hover { color: var(--text); border-color: var(--brand); }
  .empty { text-align: center; padding: 18px 6px; }
  .empty h2 { margin: 0 0 6px; font-size: 16px; }
  .empty p { margin: 0; color: var(--muted); font-size: 12.5px; }
  .hidden { display: none !important; }
</style>
</head>
<body>
  <div class="card" id="card">
    <div class="top">
      <span class="badge" id="badge">Bumbee</span>
      <div style="display:flex;align-items:center;gap:8px;">
        <span class="meta" id="meta"></span>
        <span class="x" id="closeBtn" title="Đóng (Esc)">×</span>
      </div>
    </div>

    <!-- 🧠 Game từ vựng siêu trí nhớ — khung riêng, chạy song song game câu -->
    <div class="wgame" id="wgame">
      <div class="whead">
        <span class="wtitle">🧠 Siêu trí nhớ từ vựng</span>
        <span class="wstreak" id="wstreak"></span>
      </div>
      <div class="wcue" id="wcue"></div>
      <div class="wchoices" id="wchoices"></div>
      <div class="wfeedback" id="wfeedback"></div>
    </div>

    <!-- 💬 Gợi ý cụm giao tiếp / từ vựng mới -->
    <div class="sugg" id="sugg">
      <span class="icon">💬</span>
      <span class="body" id="suggBody">Đang tìm cụm giao tiếp hay…</span>
      <span class="btns">
        <button class="speak" id="suggSpeak" title="Nghe cụm này">🔊</button>
        <button class="speak" id="suggNext" title="Cụm khác">↻</button>
      </span>
    </div>

    <!-- Thẻ Từ vựng: recap từ vừa học / từ mới vừa thêm -->
    <div class="spot hidden" id="spot">
      <span class="tag" id="spotTag">Từ vựng</span>
      <div class="termrow">
        <span class="term" id="spotTerm"></span>
        <span class="ipa" id="spotIpa"></span>
        <button class="speak" id="spotSpeak" title="Nghe từ + câu ví dụ (phím R)">🔊</button>
      </div>
      <div class="vi" id="spotVi"></div>
      <div class="ex" id="spotEx"></div>
    </div>

    <div id="game">
      <div class="scene" id="scene"></div>
      <div class="cue" id="cue"></div>
      <div class="choices" id="choices"></div>
      <div class="fbrow">
        <div class="feedback" id="feedback"></div>
      </div>
    </div>

    <div id="empty" class="empty hidden">
      <h2>🎉 Xong hết từ đến hạn!</h2>
      <p>Quay lại luyện tiếp khi có từ mới hoặc tới lịch ôn.</p>
    </div>

    <button id="profileBtn" title="Khai nghề nghiệp, đam mê, CV — AI sẽ soạn từ vựng đúng lĩnh vực của bạn mỗi 3 ngày"
      style="-webkit-app-region:no-drag; cursor:pointer; width:100%; display:flex; align-items:center; gap:8px; justify-content:center;
             background:linear-gradient(135deg, rgba(244,200,66,.16), rgba(244,200,66,.06)); border:1.5px solid rgba(244,200,66,.55);
             color:var(--brand); font-weight:700; font-size:12.5px; border-radius:10px; padding:8px 10px;">
      👤 Hồ sơ đam mê của bạn — AI soạn từ vựng đúng nghề, đúng sở thích
    </button>

    <div class="addrow">
      <input id="addInput" maxlength="600" placeholder="Gõ từ / cụm / dán cả đoạn nháp — AI tự tách từ để học…" />
      <button class="btn" id="addBtn" title="AI sẽ soạn nghĩa + ví dụ rồi đưa vào game">＋ Thêm</button>
    </div>
    <div class="addmsg" id="addMsg"></div>

    <div class="foot">
      <div class="left">
        <select class="mode" id="gameType" title="Kiểu chơi: trộn cả hai / chọn câu / chọn từ vựng">
          <option value="mix">🔀 Trộn</option>
          <option value="sentence">📝 Câu</option>
          <option value="vocab">🔤 Từ vựng</option>
        </select>
        <label title="Nhìn nghĩa tiếng Việt, chọn từ tiếng Anh"><input type="checkbox" id="reverse" /> Việt→Anh</label>
        <label title="Tự động nảy thử thách theo nhịp"><input type="checkbox" id="auto" /> Tự nảy</label>
      </div>
      <div style="display:flex;gap:6px;">
        <button class="btn" id="snoozeBtn" title="Tạm ẩn 30 phút">Để sau</button>
        <button class="btn" id="skipBtn">Bỏ qua ›</button>
      </div>
    </div>
  </div>
  <script src="vocab-challenge.js"></script>
</body>
</html>
