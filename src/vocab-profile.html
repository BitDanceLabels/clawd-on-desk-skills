<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self';" />
<title>Hồ sơ đam mê — Bumbee</title>
<style>
  :root { --brand:#f4c842; --bg:#10151f; --card:#182130; --line:#2a3547; --text:#eef2f8; --muted:#93a1b5; --ok:#35c88a; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; }
  body { font-family:-apple-system,"Segoe UI",system-ui,sans-serif; background:transparent; color:var(--text); padding:10px; user-select:none; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; box-shadow:0 18px 50px rgba(0,0,0,.45); padding:16px; display:flex; flex-direction:column; gap:10px; height:100%; overflow-y:auto; -webkit-app-region:drag; }
  button,input,textarea,label { -webkit-app-region:no-drag; }
  .top { display:flex; align-items:center; justify-content:space-between; }
  .badge { font-size:11px; font-weight:700; color:#1a1205; background:var(--brand); padding:3px 8px; border-radius:999px; }
  .x { cursor:pointer; color:var(--muted); font-size:18px; -webkit-app-region:no-drag; }
  .x:hover { color:var(--text); }
  h1 { font-size:15px; margin:0; }
  p.sub { font-size:11.5px; color:var(--muted); margin:0; line-height:1.45; }
  .field { display:flex; flex-direction:column; gap:3px; }
  .field label { font-size:11px; font-weight:700; color:var(--brand); }
  input, textarea { background:#131b27; border:1px solid var(--line); color:var(--text); border-radius:8px; padding:7px 10px; font-size:12.5px; outline:none; font-family:inherit; }
  input:focus, textarea:focus { border-color:var(--brand); }
  textarea { resize:vertical; min-height:44px; }
  .row2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .btns { display:flex; gap:8px; margin-top:2px; }
  .btn { cursor:pointer; border-radius:9px; font-size:12.5px; padding:8px 12px; border:1px solid var(--line); background:#131b27; color:var(--text); }
  .btn.primary { background:var(--brand); color:#1a1205; font-weight:700; border-color:var(--brand); }
  .btn:hover { border-color:var(--brand); }
  .status { font-size:11.5px; color:var(--muted); min-height:14px; }
  .status.ok { color:var(--ok); }
</style>
</head>
<body>
  <div class="card">
    <div class="top">
      <span class="badge">🐝 Hồ sơ đam mê</span>
      <span class="x" id="closeBtn" title="Đóng">×</span>
    </div>
    <h1>AI hiểu bạn — dạy đúng cái bạn cần</h1>
    <p class="sub">Chia sẻ nghề nghiệp, đam mê, sách và link của bạn. Cứ mỗi 3 ngày AI sẽ tự biên soạn từ vựng + mẫu câu giao tiếp đúng lĩnh vực của bạn và đưa vào game — như một seminar riêng, vừa học vừa nâng tay nghề.</p>

    <div class="field"><label>💼 Nghề nghiệp / lĩnh vực</label><input id="profession" placeholder="VD: kỹ sư phần mềm, bác sĩ, founder AI studio…" /></div>
    <div class="field"><label>🔥 Đam mê & sở thích</label><textarea id="passions" placeholder="VD: làm nhạc AI, YouTube automation, xây SaaS, bóng đá…"></textarea></div>
    <div class="field"><label>📚 Sách / thư viện yêu thích</label><textarea id="books" placeholder="VD: Zero to One, Deep Work, docs của Anthropic…"></textarea></div>
    <div class="field"><label>🎯 Môn / chủ đề muốn giỏi</label><textarea id="subjects" placeholder="VD: đàm phán giá, pitching, viết email khách Tây…"></textarea></div>
    <div class="row2">
      <div class="field"><label>Facebook</label><input id="facebook" placeholder="link FB cá nhân" /></div>
      <div class="field"><label>LinkedIn</label><input id="linkedin" placeholder="link LinkedIn" /></div>
      <div class="field"><label>YouTube</label><input id="youtube" placeholder="link kênh" /></div>
      <div class="field"><label>Website</label><input id="website" placeholder="link web của bạn" /></div>
    </div>
    <div class="btns">
      <button class="btn primary" id="saveBtn">💾 Lưu hồ sơ</button>
      <button class="btn" id="curateBtn" title="AI soạn ngay 8-10 từ vựng theo hồ sơ">🪄 Biên soạn ngay</button>
    </div>
    <div class="status" id="status"></div>
  </div>
  <script src="vocab-profile.js"></script>
</body>
</html>
