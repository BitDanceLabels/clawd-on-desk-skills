<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self'; font-src 'self'">
  <title>JAVIS</title>
  <link rel="stylesheet" href="desk.css">
</head>
<body data-mode="compact" data-side="right" data-phase="idle">
  <main id="board" class="board" data-hit aria-label="Bảng JAVIS" hidden>
    <header class="board-head">
      <div class="brand">
        <span class="mark" aria-hidden="true"></span>
        <div>
          <b>JAVIS</b>
          <small id="greeting">Chào anh</small>
        </div>
      </div>
      <div class="head-tools">
        <span id="link-state" class="link-state" title="Kết nối JAVIS"></span>
        <button id="btn-menu" class="icon-btn" type="button" aria-label="Tuỳ chọn">⋯</button>
        <button id="btn-close" class="icon-btn" type="button" aria-label="Thu gọn">✕</button>
      </div>
    </header>
    <nav class="quick" id="quick" aria-label="Hiển hoá nhanh">
      <button type="button" data-ask="việc cần anh">Việc cần anh</button>
      <button type="button" data-ask="các máy đang sao">Máy</button>
      <button type="button" data-ask="kho tài sản">Kho</button>
      <button type="button" data-ask="cảnh báo">Cảnh báo</button>
      <button type="button" data-ask="số liệu kênh">Kênh</button>
      <button type="button" data-ask="dòng tiền">Dòng tiền</button>
      <button type="button" data-ask="kết quả vừa làm">Kết quả</button>
    </nav>
    <section id="cards" class="cards" aria-live="polite"></section>
    <form id="ask" class="ask" autocomplete="off">
      <button id="btn-mic" class="mic" type="button" aria-label="Nói với JAVIS">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-2.08A7 7 0 0 0 19 12h-2Z"/></svg>
      </button>
      <input id="input" type="text" placeholder="Nói hoặc gõ: việc hôm nay, máy, kho video, dòng tiền…" aria-label="Lệnh cho JAVIS" maxlength="2000">
      <button class="send" type="submit" aria-label="Gửi">↑</button>
    </form>
  </main>

  <aside id="bubble" class="bubble" data-hit role="status" hidden>
    <p id="bubble-text"></p>
    <div id="bubble-actions" class="bubble-actions"></div>
  </aside>

  <div id="stage" class="stage" data-hit aria-label="Bé JAVIS — bấm để mở, kéo để di chuyển" role="button" tabindex="0">
    <div class="halo" aria-hidden="true"></div>
    <canvas id="holo"></canvas>
    <div id="badge" class="badge" hidden></div>
  </div>

  <script src="desk.bundle.js"></script>
</body>
</html>
