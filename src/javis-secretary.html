<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;">
  <title>Thư ký JAVIS</title>
  <link rel="stylesheet" href="javis-tools.css">
</head>
<body>
  <header class="top">
    <img src="icon.png" alt="">
    <div class="who"><b>Báo cáo hôm nay</b><small id="sub">Thư ký JAVIS</small></div>
  </header>
  <main>
    <div class="card">
      <p class="muted" id="voice"><span id="wave" class="wave hidden"><i></i><i></i><i></i><i></i></span><span id="voice-text">Chưa đọc</span></p>
      <div id="text" class="speech">Đang lấy báo cáo…</div>
    </div>
    <p class="muted">Báo cáo rút gọn, đọc dưới 90 giây. Giọng: ưu tiên VieNeu trên máy, không có thì giọng JAVIS, cuối cùng là giọng hệ thống.</p>
  </main>
  <footer>
    <span id="len"></span><span class="sp"></span>
    <button id="btn-again" class="small">▶ Đọc lại</button>
    <button id="btn-stop" class="stop">⏹ Dừng</button>
  </footer>
  <script src="javis-secretary-page.js"></script>
</body>
</html>
